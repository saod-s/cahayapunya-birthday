<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Slice of Happiness</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        /* Pastel Color Palette */
        :root {
            --pink-blush: #FFDDE2; /* Soft Pink */
            --lilac-dream: #E0BBE4; /* Light Purple/Lilac */
            --mint-kiss: #D3F3EE; /* Mint Green */
            --cream-white: #FFFFF0;
            --deep-rose: #C39EA0; /* Darker accent for text */
            --cake-base: #F7E7CE; /* Light Beige for cake body */
            --frosting: #FFE5F1; /* Soft pink for frosting */
            --flame: #FFD700; /* Gold/Yellow for flame */
            --smoke: rgba(100, 100, 100, 0.4);
        }

        /* Basic Setup and Background */
        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
            color: var(--deep-rose);
            background: linear-gradient(135deg, var(--mint-kiss) 0%, var(--pink-blush) 50%, var(--lilac-dream) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-attachment: fixed;
            line-height: 1.6;
            overflow: hidden; /* Keep it clean */
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 90%;
            margin: 20px auto;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #A56994;
            font-size: 3em;
            margin-top: 0;
        }

        /* --- CAKE STYLING --- */
        .cake-stand {
            width: 300px;
            height: 10px;
            background-color: var(--deep-rose);
            border-radius: 0 0 15px 15px;
            margin: 0 auto 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .cake {
            position: relative;
            width: 280px;
            height: 150px;
            background-color: var(--cake-base);
            border-radius: 50% / 20%;
            margin: 0 auto;
            border: 3px solid var(--deep-rose);
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.1);
        }

        /* Frosting Top */
        .cake::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -3px;
            right: -3px;
            height: 25px;
            background-color: var(--frosting);
            border-radius: 50% / 20%;
            border: 3px solid var(--deep-rose);
            border-bottom: none;
            z-index: 2;
        }

        /* Decorative Icing Drips */
        .cake::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            height: 20px;
            background: 
                radial-gradient(circle at 10% 100%, transparent 10px, var(--frosting) 10px) 0 0,
                radial-gradient(circle at 30% 100%, transparent 10px, var(--frosting) 10px) 0 0,
                radial-gradient(circle at 50% 100%, transparent 10px, var(--frosting) 10px) 0 0,
                radial-gradient(circle at 70% 100%, transparent 10px, var(--frosting) 10px) 0 0,
                radial-gradient(circle at 90% 100%, transparent 10px, var(--frosting) 10px) 0 0;
            background-size: 20% 100%;
            background-repeat: repeat-x;
            z-index: 3;
            border-radius: 0 0 15px 15px;
        }
        
        /* --- CANDLE STYLING --- */
        .candle-group {
            position: absolute;
            top: -15px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 4;
            padding: 0 30px;
        }

        .candle {
            width: 8px;
            height: 20px;
            background-color: var(--lilac-dream);
            border: 1px solid var(--deep-rose);
            border-radius: 2px;
            position: relative;
            transform: translateY(-5px);
        }

        .flame {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 10px;
            background-color: var(--flame);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 5px 2px #FFA500, 0 0 10px 4px rgba(255, 165, 0, 0.5);
            animation: flicker 0.2s infinite alternate;
            opacity: 1;
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            z-index: 5;
        }

        /* Animation for the flame (still lit) */
        @keyframes flicker {
            0% { transform: translateX(-50%) scaleY(1); box-shadow: 0 0 5px 2px #FFA500; }
            100% { transform: translateX(-50%) scaleY(0.95); box-shadow: 0 0 6px 3px #FF8C00; }
        }

        /* Class for blown-out candles */
        .flame.blown-out {
            opacity: 0; /* Candle is gone */
            transform: translateY(20px); /* Move down slightly for effect */
        }
        
        .flame.blown-out::after {
            content: "";
            position: absolute;
            top: 5px;
            left: 50%;
            width: 2px;
            height: 15px;
            background-color: var(--smoke);
            border-radius: 50%;
            transform: translateX(-50%);
            animation: smokeRise 1s forwards;
            opacity: 0;
        }

        /* Animation for the smoke (only plays when blown out) */
        @keyframes smokeRise {
            0% { transform: translateX(-50%) translateY(0); opacity: 1; }
            100% { transform: translateX(-50%) translateY(-20px); opacity: 0; }
        }

        /* --- BUTTON STYLING --- */
        #blow-button {
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #FF69B4;
            color: var(--cream-white);
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 5px #C3518C;
        }

        #blow-button:hover {
            background-color: #C3518C;
        }

        #blow-button:active {
            transform: translateY(4px);
            box-shadow: 0 1px #C3518C;
        }
        
        .message {
            margin-top: 20px;
            font-size: 1.1em;
            color: #A56994;
        }
        
    </style>
</head>
<body>

    <div class="container">
        <h1>Make a Wish!</h1>
        <p class="message">Now, close your eyes, make a wish, and click the button to 'blow off' the candles!</p>

        <div class="cake-stand"></div>
        <div class="cake">
            <div class="candle-group">
                <div class="candle">
                    <div class="flame" id="flame1"></div>
                </div>
                <div class="candle">
                    <div class="flame" id="flame2"></div>
                </div>
                <div class="candle">
                    <div class="flame" id="flame3"></div>
                </div>
            </div>
        </div>

        <button id="blow-button" onclick="blowOutCandles()">
            Blow Off The Candles! 💨
        </button>

        <p class="message" id="wish-message" style="display: none; font-weight: bold; font-size: 1.5em; color: #8E44AD;">
            Your wish is sealed! Hope it comes true, Nina. ❤️
        </p>
    </div>

    <script>
        function blowOutCandles() {
            // Get all elements with the class 'flame'
            const flames = document.querySelectorAll('.flame');
            
            // Loop through each flame and add the 'blown-out' class
            flames.forEach(flame => {
                flame.classList.add('blown-out');
            });
            
            // Change the button text and disable it
            const button = document.getElementById('blow-button');
            button.innerText = "Wish Made! ✨";
            button.disabled = true;
            
            // Show the final message
            document.getElementById('wish-message').style.display = 'block';
        }
    </script>

</body>
</html>
